##  cy-simple.conf v1.25 | Shadowrocket 精简版 | Author: ChungyuCheung
##  最后更新：2026-11-10 23:48 UTC+8
##  用途：局域网/公司内网域名直连 + 系统 DNS；中国域名直连、中国 IP（GEOIP,CN）直连；邮件 / AI / Google 独立 VPS 分组（Google 含 YouTube / Gemini）；其余走代理；自建 VPS 216.36.82.250 直连；
##        DNS/WebRTC 防泄漏；手机用 Gmail App，不含 Foxmail 进程规则。
##  用法：Shadowrocket「配置」→ 添加 raw 链接 → 使用。自定义内网域名：见 [Rule] 与 [Host] 里的「自定义」区。
