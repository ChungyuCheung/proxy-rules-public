## ============================================
##  cy.conf v6.5 | Shadowrocket 完整版（第三代 Homeport 住宅链式代理大版本） | Author: ChungyuCheung
##  最后更新：2026-11-19 12:46 UTC+8
##  用途：国内直连 / 海外代理 / 邮件 / AI / Google / 🏠 住宅出口 独立分组（支持 Webshare 静态住宅代理链 + 自建 VPS 双轨切换）；
##        自建 VPS 216.36.82.250、RackNerd 192.3.153.152 直连；DNS 防泄漏（直连与中国域名=系统 DNS，其余=海外加密 DoH 经代理）；WebRTC/QUIC 防泄漏。
##  Webshare 静态住宅代理链用法（解决 VPS 故障时住宅 IP 失效）：
##    1) 在 Shadowrocket 首页点击右上角「+」，添加类型「Socks5」（填 Webshare 的 IP、端口、账号、密码，备注含 Webshare 或 🏠，如「🏠 Webshare-1」）；
##    2) 在该节点编辑页点「代理链（Relay）」→ 选择策略组「HP_Relay」（或直接指定某个机场节点）；
##    3) 在「配置 → 策略组」中，将「🏠 住宅出口」（以及需要走住宅 IP 的 AI / 邮件 / Google）选为「🏠 住宅出口 手选」并在子组点选该节点。
