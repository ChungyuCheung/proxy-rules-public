# =====================================================================
# cy-clash-ios.yaml v1.8 | iPhone Clash 1.0.15 (171) / ProjectClash
# 最后更新：2026-11-11 20:10 UTC+8
# 基准：Shadowrocket cy.conf v5.26（2026-11-06）；静态规则顺序与策略保持一致。
# 国内/内网直连；海外走 PROXY；邮件 / AI / Google 纯手动选择 NovixLink / Webshare 节点（固定 IP，不自动切换）。
# 使用：填写 airport1~3 的 Clash/mihomo 订阅（含自建 VPS）；删除不用的 provider 及 use 引用。
# 首次在 PROXY 手选日常节点；默认 REJECT。单独导入的其他 Profile 不会自动进入本文件。
# 邮件/AI/Google：节点名须含 NovixLink 或 Webshare（忽略大小写），排除信息节点；
#          无匹配节点时 REJECT，不回落机场或直连。
# DNS：直连/国内/内网/节点域名=system，海外四个 DoH 均经 PROXY；无系统 DNS 回退。
# 规则：MetaCubeX MRS 分类对应小火箭；与 Loyalsoldier 的域名收录可能有差异。
# WebRTC：常见 STUN/TURN 端口代理，不支持 UDP 则拒绝；不提供 STUN 响应 IP 伪装。
# QUIC：原本应走代理的 UDP 443 拒绝，先命中 DIRECT 的连接保持直连。
# WeatherKit：只迁移路由；重写/MITM 需在 App 另导入模块并配置证书。
# 更新日志：CHANGELOG.md。真实订阅只在客户端本地填写，不提交仓库。
# =====================================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
geodata-mode: false
geo-auto-update: true
geo-update-interval: 168
geox-url:
  mmdb: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country-lite.mmdb
  asn: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com

# 海外 DoH 合并为解析池；default-nameserver 仅引导解析 DNS 服务器地址。
# IP 形式 DoH 无需域名引导；system 采用连接前的系统 DNS。iOS 不额外开放 DNS 监听端口。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  default-nameserver:
  - system
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
  - https://1.0.0.1/dns-query#PROXY
  - https://8.8.4.4/dns-query#PROXY
  direct-nameserver:
  - system
  direct-nameserver-follow-policy: false
  proxy-server-nameserver:
  - system
  nameserver-policy:
    +.cn: system
    +.local: system
    +.lan: system
    +.internal: system
    +.huitone.com: system
    +.huinor.com: system
    +.synology.me: system
    +.kunyi-gzzc.com: system
    +.kunyi-gz.com: system
    +.kunqi-dev.com: system
    +.kunqi-demo.com: system
    +.kunqi-test.com: system
    +.kunyi-pro: system
    +.kunqi-gz: system
    +.jiandui.online: system
    +.ooioo.work: system
    +.qq.com: system
    +.weixin.qq.com: system
    +.wechat.com: system
    +.weixin.com: system
    +.servicewechat.com: system
    +.tenpay.com: system
    +.alipay.com: system
    +.alipayobjects.com: system
    +.taobao.com: system
    +.tmall.com: system
    +.aliyun.com: system
    register.appattest.apple.com: system
    captive.apple.com: system
    +.ls.apple.com: system
    +.mesu.apple.com: system
    +.swscan.apple.com: system
    +.gdmf.apple.com: system
    +.ocsp.apple.com: system
    +.ess.apple.com: system
    +.weatherkit.pages.dev: system
    +.中国: system
    +.qpic.cn: system
    +.qlogo.cn: system
    rule-set:private: system
    rule-set:icloud: system
    rule-set:apple: system
    rule-set:cn: system
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.internal'
  - +.home.arpa
  - localhost.ptlogin2.qq.com
  - captive.apple.com
  - sequoia.apple.com
  - seed-sequoia.siri.apple.com
  - +.ls.apple.com
  - +.push.apple.com
  - +.icloud.com
  - time.apple.com
  - +.time.apple.com
  - +.ntp.org
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.stun.*.*
  - +.stun.*.*.*
  - +.huitone.com
  - +.huinor.com
  - +.synology.me
  - +.kunyi-gzzc.com
  - +.kunyi-gz.com
  - +.kunqi-dev.com
  - +.kunqi-demo.com
  - +.kunqi-test.com
  - +.kunyi-pro
  - +.kunqi-gz
  - +.jiandui.online
  - +.ooioo.work

# 按需填写订阅，删除不用的 airportN 及下方 use 引用；前缀区分多机场同名节点。
# 不强制覆盖节点的 UDP 能力声明。
proxy-providers:
  airport1:
    type: http
    url: "https://your-subscription-url-1"
    path: ./providers/airport1.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
    override:
      additional-prefix: '[A1] '
  airport2:
    type: http
    url: "https://your-subscription-url-2"
    path: ./providers/airport2.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
    override:
      additional-prefix: '[A2] '
  airport3:
    type: http
    url: "https://your-subscription-url-3"
    path: ./providers/airport3.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
    override:
      additional-prefix: '[A3] '

# REJECT 是显式空组兜底，避免内核默认 COMPATIBLE 可能直连。
# 首次在 PROXY 手选日常节点；业务组纯手动选择具体 VPS 节点（固定 IP，不自动切换）。
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - REJECT
  use:
  - airport1
  - airport2
  - airport3
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|更新|提醒|订阅|訂閱|traffic|expire|remaining|reset)
- name: 📧 邮件
  type: select
  proxies:
  - REJECT
  use:
  - airport1
  - airport2
  - airport3
  filter: (?i)(NovixLink|Webshare)
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|更新|提醒|订阅|訂閱|traffic|expire|remaining|reset)
- name: 🤖 AI
  type: select
  proxies:
  - REJECT
  use:
  - airport1
  - airport2
  - airport3
  filter: (?i)(NovixLink|Webshare)
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|更新|提醒|订阅|訂閱|traffic|expire|remaining|reset)
- name: 🌐 Google
  type: select
  proxies:
  - 🤖 AI
  - REJECT
  use:
  - airport1
  - airport2
  - airport3
  filter: (?i)(NovixLink|Webshare)
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|更新|提醒|订阅|訂閱|traffic|expire|remaining|reset)

# iOS 优先 MRS 预编译域名规则，减少文本规则加载内存；每日经 PROXY 更新。
rule-providers:
  ai:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
    path: ./ruleset/meta/geosite-category-ai-!cn.mrs
    interval: 86400
    proxy: PROXY
