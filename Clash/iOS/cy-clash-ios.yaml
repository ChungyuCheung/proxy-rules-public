    interval: 86400
    proxy: PROXY

# 只在原本应走代理的条件命中后拦截 UDP 443，其余流量交给对应策略组。
sub-rules:
  PROXY-OUT:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - MATCH,PROXY
  MAIL-OUT:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - MATCH,📧 邮件
  AI-OUT:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - MATCH,🤖 AI
  GOOGLE-OUT:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - MATCH,🌐 Google

# 每个 SUB-RULE 后紧跟同条件 REJECT：若内核因节点不支持 UDP 而跳过该路由，
# 立即拒绝，避免继续命中后续 DIRECT。STUN/TURN 同理；IP 类规则保留 no-resolve。
rules:
- SUB-RULE,(AND,((IP-CIDR,216.36.82.250/32,no-resolve),(DST-PORT,22))),PROXY-OUT
- AND,((IP-CIDR,216.36.82.250/32,no-resolve),(DST-PORT,22)),REJECT
- IP-CIDR,216.36.82.250/32,DIRECT,no-resolve
- IP-CIDR,192.3.153.152/32,DIRECT,no-resolve
- IP-CIDR,47.242.128.61/32,DIRECT,no-resolve
- OR,((DST-PORT,3478-3481),(DST-PORT,5349),(DST-PORT,19302-19309)),PROXY
- OR,((DST-PORT,3478-3481),(DST-PORT,5349),(DST-PORT,19302-19309)),REJECT
- IP-ASN,45090,DIRECT,no-resolve
- IP-ASN,132203,DIRECT,no-resolve
- SUB-RULE,(DOMAIN,imap.gmail.com),MAIL-OUT
- DOMAIN,imap.gmail.com,REJECT
- SUB-RULE,(DOMAIN,smtp.gmail.com),MAIL-OUT
- DOMAIN,smtp.gmail.com,REJECT
- SUB-RULE,(DOMAIN,pop.gmail.com),MAIL-OUT
- DOMAIN,pop.gmail.com,REJECT
- DOMAIN,register.appattest.apple.com,DIRECT
- DOMAIN,captive.apple.com,DIRECT
- DOMAIN-SUFFIX,ls.apple.com,DIRECT
