# ===== Loyalsoldier Merge 覆写 v2 | Clash Verge Rev「全局扩展覆写配置」（Merge YAML）=====
# 用途：Loyalsoldier 规则集白名单分流；自建 VPS 216.36.82.250 直连；DNS（中国+内网=system，外网=DoH 经 Proxy）/WebRTC 防泄漏。
# 用法：粘贴到 Clash Verge Rev 全局扩展覆写配置。策略组名用订阅里的「Proxy」，订阅没有这个组时改成实际组名。
#       静态文件不能填 VPS_URL，需要 Foxmail 走自建 VPS 请用 bettbox-mrs.js 脚本。
# 最新改动 2026-11-03：VPS IP 直连、DNS 防泄漏、规则集改 GitHub raw。历史版本见私有仓库 git 记录。

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400

  tld-not-cn:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

ipv6: false

# [2026-11-03] DNS 防泄漏：中国 + 内网 = 系统 DNS；外网 = 加密 DoH 经代理
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: false
  use-system-hosts: true
  # 外网域名 / IP 规则解析：Google、Cloudflare DoH，经「Proxy」组发出，本地网络看不到查询
  nameserver:
    - "https://8.8.8.8/dns-query#Proxy"
    - "https://1.1.1.1/dns-query#Proxy"
  # 直连流量：当前网络的系统 DNS（公司/家里自动切换，不写死 IP）
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: false
  # 机场节点域名：加密 DoH（阿里/腾讯，按 IP 写）；节点必须直连解析
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://1.12.12.12/dns-query"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:direct": system
    "+.cn": system
    "+.lan": system
    "+.local": system
    "+.home.arpa": system
    "+.huinor.com": system
    "+.huitone.com": system
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "localhost"
    - "+.huinor.com"
    - "+.huitone.com"

# 用 rules 插到订阅原有规则（含其 MATCH 兜底）之前，确保完整生效
rules:
  # [2026-11-03] 自建 VPS IP 直连（必须第一条）
  - IP-CIDR,216.36.82.250/32,DIRECT,no-resolve
  # [2026-11-03] WebRTC/STUN 防泄漏：先走代理，节点不支持 UDP 则拒绝
  - OR,((DST-PORT,3478-3481),(DST-PORT,5349),(DST-PORT,19302-19309)),Proxy
  - OR,((DST-PORT,3478-3481),(DST-PORT,5349),(DST-PORT,19302-19309)),REJECT
  # —— 公司内网最优先，永不走代理（默认推荐，任何环境都安全）——
  - DOMAIN-SUFFIX,huinor.com,DIRECT
  - DOMAIN-SUFFIX,huitone.com,DIRECT
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,Proxy
  - RULE-SET,proxy,Proxy
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve
  - RULE-SET,cncidr,DIRECT,no-resolve
  - RULE-SET,telegramcidr,Proxy,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Proxy